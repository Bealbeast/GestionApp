{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body">
            <h3 class="text-center mb-4">✨ Bienvenida, Colofe ✨</h3>
            <p class="text-muted text-center">Este es tu espacio personal para organizar, estudiar y no sufrir en el intento.</p>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'account_signup' %}">¿No tienes cuenta? Regístrate</a>
            </div>
            </div>
        </div>
    </div>
    </div>
</div>
{% endblock %}
